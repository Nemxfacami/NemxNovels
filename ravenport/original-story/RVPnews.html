<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Page</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #0a0a0a;
        color: white;
    }

    /* NAVBAR */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 25px;
        background: black;
        border-bottom: 1px solid #222;
    }

    .nav-left {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .menu {
        font-size: 22px;
        cursor: pointer;
    }

    .logo {
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .nav-right span {
        margin-left: 20px;
        font-size: 14px;
        cursor: pointer;
    }

    /* HERO */
    .hero {
        position: relative;
        height: 300px;
        background:none;
        display: flex;
        align-items: flex-end;
        padding: 30px;
    }

    .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.5);
    }

    .hero-content {
        position: relative;
        max-width: 700px;
    }

    .hero small {
        text-decoration: underline;
        color: #ccc;
    }

    .hero h1 {
        margin-top: 10px;
        font-size: 32px;
        line-height: 1.2;
    }

    .hero p {
        margin-top: 10px;
        font-size: 14px;
        color: #aaa;
    }

    /* CONTENT */
    .content {
        background: #f4f4f4;
        color: black;
        padding: 30px;
    }

    .article {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid #ddd;
        padding-bottom: 30px;
    }

    .article-text {
        max-width: 500px;
    }

    .article-text small {
        text-decoration: underline;
    }

    .article-text h2 {
        margin-top: 10px;
        font-size: 28px;
        line-height: 1.3;
    }

    .article img {
        width: 200px;
        height: 200px;
        object-fit: cover;
    }

    /* RESPONSIVE */
    @media(max-width: 768px) {
        .article {
            flex-direction: column;
            align-items: flex-start;
        }

        .article img {
            width: 100%;
            height: auto;
        }
    }
    
    a{text-decoration:none;color:black}
</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="nav-left">
        <div class="menu">☰</div>
        <div class="logo">RVPnews</div>
    </div>

    <div class="nav-right">
        <span></span>
        <span>NEWSLETTER</span>
    </div>
</div>

<!-- HERO SECTION -->
<div class="hero">
    <div class="hero-content">
        <small>Rated and Slated</small>
        <h1>Rated and Slated: Things We Hate and Love About Ravenport</h1>
        <p>BY ADAM SMITH</p>
    </div>
</div>

<!-- CONTENT -->
<div class="content">
    <div class="article">
        <div class="article-text">
            <small>10 August 2022</small>
            <h2><a href ="Earthquake.html">The Earthquake that woke everyone.</a></h2>
        </div>

        <img src="ship.png" alt="article image">
    </div>
</div>
<div class="content">
    <div class="article">
        <div class="article-text">
            <small>21 September 2022</small>
            <h2><a href ="Great.html">The Great Erasal</a></h2>
        </div>

        <img src="erasal.png" alt="article image">
    </div>
</div>
<div class="content">
    <div class="article">
        <div class="article-text">
            <small>22 September 2022</small>
            <h2><a href ="Wakeup.html">Wake Up People!! Something happened</a></h2>
        </div>

        <img src="yesterday.png" alt="article image">
    </div>
</div>
</body>
</html>
