<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="description" content="Blue Chatroom — A fictional messaging experience from NemxNovels. Explore contacts, conversations, and the people behind the messages.">

    <meta name="author" content="NemxNovels">

    <meta name="keywords" content="NemxNovels, Blue Chatroom, fictional chat, messaging, interactive story, digital story, chatroom">

    <link rel="icon" type="image/png" href="favicon.png">

    <meta property="og:image" content="https://nemxnovels.site/havenfall/blueroom/nemxnovels-blueroom-og.webp">
    <meta property="og:title" content="NemxNovels — Blue Chatroom">
    <meta property="og:description" content="A fictional messaging experience where conversations reveal more than they seem. Explore the contacts behind Blue Chatroom.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NemxNovels">
    <meta property="og:url" content="https://nemxnovels.site/havenfall/blueroom/vlad.html">

    <meta name="robots" content="noindex, nofollow">


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger Chat - Vlad Ardmore</title>

<style>
  :root{
    --bg:#0b0b0c;
    --header-bg:#131314;
    --incoming:#3a3b3c;
    --outgoing:#0b84fe;
    --text:#e9e9ea;
    --muted:#9a9a9d;
    --divider:#8a8a8d;
    --quote-bg:#2a2a2b;
    --green:#31d158;
  }

  *{
    box-sizing:border-box;
  }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
  }

  #phone{
    width:100%;
    max-width:420px;
    height:100vh;
    margin:0 auto;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .header{
    height:64px;
    min-height:64px;
    background:var(--header-bg);
    display:flex;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid #242426;
  }

  .back{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  .back svg{
    width:24px;
    height:24px;
    fill:none;
    stroke:#fff;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .header-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
    margin-right:10px;
  }

  .header-info{
    flex:1;
    min-width:0;
  }

  .header-name{
    color:#fff;
    font-size:16px;
    font-weight:600;
    text-decoration:none;
  }

  .header-status{
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .header-actions img{
    width:21px;
    height:21px;
    object-fit:contain;
    cursor:pointer;
  }

  .chat{
    flex:1;
    overflow-y:auto;
    padding:14px 12px 18px;
    scrollbar-width:none;
  }

  .chat::-webkit-scrollbar{
    display:none;
  }

  .time-divider{
    text-align:center;
    color:var(--divider);
    font-size:11px;
    margin:8px 0 14px;
  }

  .group{
    display:flex;
    align-items:flex-end;
    margin:3px 0;
    max-width:100%;
  }

  .group.in{
    justify-content:flex-start;
  }

  .group.out{
    justify-content:flex-end;
  }

  .group-avatar{
    width:26px;
    height:26px;
    border-radius:50%;
    object-fit:cover;
    margin-right:7px;
    flex-shrink:0;
  }

  .bubble-stack{
    display:flex;
    flex-direction:column;
    gap:2px;
    max-width:78%;
  }

  .bubble{
    padding:8px 13px;
    font-size:15px;
    line-height:1.32;
    word-wrap:break-word;
    white-space:pre-wrap;
  }

  .in .bubble{
    background:var(--incoming);
    border-radius:18px 18px 18px 5px;
    color:var(--text);
  }

  .out .bubble{
    background:var(--outgoing);
    border-radius:18px 18px 5px 18px;
    color:#fff;
  }

  .seen{
    text-align:right;
    color:var(--muted);
    font-size:10px;
    margin:4px 4px 0 0;
  }

  .input-bar{
    min-height:62px;
    background:var(--header-bg);
    border-top:1px solid #242426;
    display:flex;
    align-items:center;
    padding:8px 10px;
    gap:8px;
  }

  .input-icon{
    width:25px;
    height:25px;
    object-fit:contain;
    cursor:pointer;
    flex-shrink:0;
  }

  .message-input{
    flex:1;
    height:40px;
    border-radius:20px;
    background:#252527;
    border:1px solid #333336;
    color:var(--text);
    padding:0 15px;
    outline:none;
    font-size:14px;
  }

  .message-input::placeholder{
    color:#88888c;
  }

  .heart{
    font-size:23px;
    line-height:1;
    cursor:pointer;
    margin-left:2px;
  }
</style>
</head>

<body>

<div id="phone">

  <div class="header">

    <div class="back" onclick="location.href='ashley-chat.html'">
      <svg viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </div>

    <img class="header-avatar" src="vlad.webp" alt="vlad">

    <div class="header-info">
      <a class="header-name" href="#">Vlad Ardmore</a>
      <div class="header-status">Active now</div>
    </div>

    <div class="header-actions">
      <img src="call.png" alt="Call">
      <img src="videocall.png" alt="Video call">
      <img src="settings.png" alt="Settings">
    </div>

  </div>

  <div class="chat" id="chat"></div>

  <div class="input-bar">
    <img class="input-icon" src="sendimages.png" alt="Images">
    <img class="input-icon" src="voicenote.png" alt="Voice note">

    <input
      class="message-input"
      type="text"
      placeholder="Message"
    >

    <div class="heart">❤️</div>
  </div>

</div>

<script>
const messages = [
  {
    sender: "vlad",
    text: "*gazes into her eyes and pulls her closer *"
  },
  {
    sender: "vlad",
    text: "I have been looking for you ,beautiful"
  }
];

const chat = document.getElementById("chat");

messages.forEach((message) => {

  const dir = message.sender === "ashley" ? "out" : "in";

  const group = document.createElement("div");
  group.className = `group ${dir}`;

  if (dir === "in") {
    const avatar = document.createElement("img");
    avatar.className = "group-avatar";
    avatar.src = "vlad.webp";
    avatar.alt = "Vlad Ardmore";
    group.appendChild(avatar);
  }

  const stack = document.createElement("div");
  stack.className = "bubble-stack";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = message.text;

  stack.appendChild(bubble);
  group.appendChild(stack);
  chat.appendChild(group);
});

chat.scrollTop = chat.scrollHeight;
</script>
</script>
</body>
</html>
