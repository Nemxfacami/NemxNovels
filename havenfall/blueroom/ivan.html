<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="description" content="Blue Chatroom — A fictional messaging experience from NemxNovels. Explore contacts, conversations, and the people behind the messages.">

    <meta name="author" content="NemxNovels">

    <meta name="keywords" content="NemxNovels, Blue Chatroom, fictional chat, messaging, interactive story, digital story, chatroom">

    <link rel="icon" type="image/png" href="favicon.png">

    <meta property="og:image" content="https://nemxnovels.site/havenfall/blueroom/nemxnovels-blueroom-og.webp">
    <meta property="og:title" content="NemxNovels — Blue Chatroom">
    <meta property="og:description" content="A fictional messaging experience where conversations reveal more than they seem. Explore the contacts behind Blue Chatroom.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NemxNovels">
    <meta property="og:url" content="https://nemxnovels.site/havenfall/blueroom/ivan.html">

    <meta name="robots" content="noindex, nofollow">


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messenger Chat - Ivan Stones</title>
<style>

  /* ============================================================
     MESSENGER CHAT TEMPLATE
     - Only the back arrow (.msgr-back) is functional — it's a
       real link to ashley-chat.html.
     - Everything else (call, video, settings, gallery, mic,
       heart, input field, "View profile") is visual only —
       pointer-events disabled on purpose.
     - No sticker icon is included in the input bar.
     ============================================================ */

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #000;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  .msgr-chat {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: #1c1c1e;
    color: #fff;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */
  .msgr-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px 12px;
    border-bottom: 1px solid #2c2c2e;
  }

  .msgr-back {
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    color: #fff;
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .msgr-back svg { width: 22px; height: 22px; }

  .msgr-header-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    background: #3a3a3c;
  }

  .msgr-header-info { flex: 1; min-width: 0; }
  .msgr-header-name { font-size: 16px; font-weight: 600; line-height: 1.2; }
  .msgr-header-status { font-size: 12px; color: #8e8e93; line-height: 1.2; margin-top: 1px; }

  .msgr-header-actions {
    display: flex;
    gap: 18px;
    align-items: center;
    pointer-events: none; /* not pressable */
  }
  .msgr-header-actions img { width: 22px; height: 22px; display: block; }

  /* ---------- body ---------- */
  .msgr-body {
    flex: 1;
    padding: 24px 16px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
  }

  .msgr-profile-photo-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    margin-bottom: 14px;
  }
  .msgr-profile-photo {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #fff;
    object-fit: cover;
    display: block;
  }
  .msgr-profile-story-time {
    position: absolute;
    bottom: -2px;
    right: -2px;
    background: #1c1c1e;
    color: #3ba55d;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 8px;
  }

  .msgr-profile-name {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .msgr-profile-meta {
    font-size: 14px;
    color: #8e8e93;
    margin-bottom: 16px;
  }

  .msgr-view-profile-btn {
    background: #3a3a3c;
    color: #fff;
    border: none;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 8px;
    margin-bottom: 28px;
    pointer-events: none; /* not pressable */
  }

  .msgr-encryption-note {
    font-size: 12.5px;
    color: #8e8e93;
    text-align: center;
    line-height: 1.5;
    max-width: 280px;
    margin-bottom: auto;
  }

  /* ---------- message bubble ---------- */
  .msgr-message-row {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    gap: 6px;
    margin-top: 20px;
  }
  .msgr-message-row.msgr-received {
    justify-content: flex-start;
  }
  .msgr-bubble {
    background: #0a7cff;
    color: #fff;
    padding: 9px 14px;
    border-radius: 18px;
    font-size: 15px;
    max-width: 75%;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .msgr-bubble.msgr-bubble-received {
    background: #3a3a3c;
    color: #fff;
  }
  .msgr-read-receipt {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #0a7cff;
    flex-shrink: 0;
  }

  /* ---------- input bar ---------- */
  .msgr-input-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-top: 1px solid #2c2c2e;
  }

  .msgr-input-icon-btn {
    background: none;
    border: none;
    padding: 4px;
    pointer-events: none; /* not pressable */
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .msgr-input-icon-btn img { width: 24px; height: 24px; }

  .msgr-input-field {
    flex: 1;
    background: #3a3a3c;
    border: none;
    border-radius: 18px;
    padding: 9px 14px;
    color: #8e8e93;
    font-size: 15px;
    pointer-events: none; /* not usable */
    caret-color: transparent;
  }
  .msgr-input-field::placeholder { color: #8e8e93; }

</style>
</head>
<body>

  <div class="msgr-chat">

    <!-- HEADER -->
    <div class="msgr-header">
      <a class="msgr-back" href="ashley-chat.html" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>

      <img class="msgr-header-avatar" src="ivan.webp" alt="ivan">

      <div class="msgr-header-info">
        <div class="msgr-header-name">Ivan Stones</div>
        <div class="msgr-header-status">Active 8h ago</div>
      </div>

      <div class="msgr-header-actions">
        <img src="call.png" alt="">
        <img src="videocall.png" alt="">
        <img src="settings.png" alt="">
      </div>
    </div>

    <!-- BODY -->
    <div class="msgr-body">

      <div class="msgr-profile-photo-wrap">
        <img class="msgr-profile-photo" src="ivan.webp" alt="ivan">
        <span class="msgr-profile-story-time">8h</span>
      </div>

      <div class="msgr-profile-name">Ivan Stones</div>
      <div class="msgr-profile-meta">You're friends on Blueroom</div>

      <button class="msgr-view-profile-btn" type="button">View profile</button>

      <p class="msgr-encryption-note">
        This conversation is secured by Blue Chatroom.<br><br>
        Only the accounts connected to this room can access its messages and calls.
      </p>

      <div class="msgr-message-row msgr-received">
        <div class="msgr-bubble msgr-bubble-received">
          Greetings
        </div>
      </div>

    </div>

    <!-- INPUT BAR (no sticker icon) -->
    <div class="msgr-input-bar">
      <button class="msgr-input-icon-btn" type="button" tabindex="-1">
        <img src="sendimages.png" alt="">
      </button>
      <button class="msgr-input-icon-btn" type="button" tabindex="-1">
        <img src="voicenote.png" alt="">
      </button>

      <input class="msgr-input-field" type="text" placeholder="Message" readonly tabindex="-1">

      <button class="msgr-input-icon-btn" type="button" tabindex="-1">
        ❤️
      </button>
    </div>

  </div>

</body>
</html>
