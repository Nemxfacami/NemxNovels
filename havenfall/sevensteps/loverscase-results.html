<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="canonical" href="https://nemxnovels.site/havenfall/sevensteps/loverscase-results.html">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="LoversCase Rating | 7 Steps of Death | NemxNovels">
<meta property="og:description" content="See your LoversCase rating and find out which character from 7 Steps of Death, a Havenfall story, you would match with.">
<meta property="og:image" content="https://nemxnovels.site/havenfall/sevensteps/sevensteps-og.webp">
<meta property="og:url" content="https://nemxnovels.site/havenfall/sevensteps/loverscase-results.html">
<meta property="og:type" content="website">
<title>LoversCase Rating | 7 Steps of Death | NemxNovels — A Havenfall Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --grey:#f2f1f4; --grey-border:#e6e4ea; --ink:#1a1a1a; --sub:#6f6d76;
    --red:#e0102a; --red-dark:#7a0512;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body {
    margin:0; min-height:100%; font-family:'Inter',sans-serif; background:var(--bg);
    background-image:
      radial-gradient(circle at 8% 8%, rgba(224,16,42,0.16), transparent 40%),
      radial-gradient(circle at 95% 90%, rgba(15,2,4,0.14), transparent 45%);
    display:flex; align-items:center; justify-content:center; padding:40px 16px;
  }
  .phone {
    width:360px; max-width:100%; background:#fff; border-radius:32px;
    box-shadow:0 30px 60px rgba(20,4,8,0.14),0 2px 6px rgba(20,4,8,0.08);
    padding:28px 20px 26px; position:relative; overflow:hidden;
  }
  .phone::before {
    content:""; position:absolute; top:-60px; right:-60px; width:180px; height:180px;
    background:radial-gradient(circle, rgba(224,16,42,0.18), transparent 70%); pointer-events:none;
  }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .logo-box { width:40px; height:40px; border-radius:10px; background:#0d0203; overflow:hidden; flex-shrink:0; }
  .logo-box img { width:100%; height:100%; object-fit:cover; }
  .brand-name { font-family:'Space Mono',monospace; font-weight:700; font-size:17px; color:var(--ink); }
  .title { font-size:20px; font-weight:700; color:var(--ink); margin:4px 0 4px; }
  .sub { font-size:12.5px; color:var(--sub); margin-bottom:18px; }
  .card { background:var(--grey); border:1px solid var(--grey-border); border-radius:18px; padding:16px; margin-bottom:16px; }
  .trait-row { margin-bottom:14px; }
  .trait-row:last-child { margin-bottom:0; }
  .trait-head { display:flex; justify-content:space-between; font-size:13px; font-weight:600; color:var(--ink); }
  .trait-head span:last-child { color:var(--red-dark); }
  .bar { height:8px; border-radius:6px; background:#fff; border:1px solid var(--grey-border); margin-top:6px; overflow:hidden; }
  .fill { height:100%; width:0; border-radius:6px; background:linear-gradient(90deg,var(--red),var(--red-dark)); transition:width 0.9s ease; }
  .btn {
    display:flex; align-items:center; justify-content:center; width:100%; border:none; border-radius:16px;
    padding:15px; font-size:15px; font-weight:700; text-decoration:none; cursor:pointer; margin-top:10px;
    font-family:'Inter',sans-serif;
  }
  .btn.primary { color:#fff; background:linear-gradient(135deg,var(--red),var(--red-dark)); box-shadow:0 6px 14px rgba(224,16,42,0.25); }
  .btn.dark { color:#fff; background:linear-gradient(135deg,#1a1a1a,#0d0203); }
  .empty { text-align:center; font-size:14px; color:var(--sub); padding:10px 0 4px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="brand">
      <div class="logo-box">
       <img src="logo.png" alt="LoversCase logo">
      </div>
        <div class="brand-name">LoversCase</div>
    </div>

    <div class="title">Your Rating</div>
    <div class="sub" id="sub">Based on the choices you made.</div>

    <div class="card" id="card"></div>

    <a class="btn primary" id="matchesBtn" href="loverscase-discover.html">See your matches</a>
    <button class="btn dark" id="retakeBtn">Retake test</button>
  </div>

<script src="loverscase-scoring.js"></script>
<script>
  // Change these to wherever the pages live on your site
  const QUIZ_PAGE = 'loverscase-quiz.html';
  const DISCOVER_PAGE = 'loverscase-discover.html';

  document.getElementById('matchesBtn').href = DISCOVER_PAGE;

  const data = lcLoadProfile();
  const card = document.getElementById('card');

  if (!data) {
    document.getElementById('sub').textContent = 'No rating yet.';
    card.innerHTML = '<div class="empty">Take the test first and your rating will show up here.</div>';
    document.getElementById('matchesBtn').style.display = 'none';
    document.getElementById('retakeBtn').textContent = 'Take the test';
  } else {
    LC_TRAITS.forEach(function (t) {
      const value = data.scores[t.key];
      const row = document.createElement('div');
      row.className = 'trait-row';
      row.innerHTML =
        '<div class="trait-head"><span>' + t.label + '</span><span>' + value + '</span></div>' +
        '<div class="bar"><div class="fill"></div></div>';
      card.appendChild(row);
      const fill = row.querySelector('.fill');
      setTimeout(function () { fill.style.width = value + '%'; }, 60);
    });
  }

  // Retaking the test deletes the old rating first
  document.getElementById('retakeBtn').addEventListener('click', function () {
    lcClearProfile();
    window.location.href = QUIZ_PAGE;
  });
</script>
</body>
</html>
