<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="canonical" href="https://nemxnovels.site/havenfall/sevensteps/loverscase-discover.html">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="LoversCase Discover | 7 Steps of Death | NemxNovels">
<meta property="og:description" content="Swipe through the cast of 7 Steps of Death, a Havenfall story, and find out who you would match with.">
<meta property="og:image" content="https://nemxnovels.site/havenfall/sevensteps/sevensteps-og.webp">
<meta property="og:url" content="https://nemxnovels.site/havenfall/sevensteps/loverscase-discover.html">
<meta property="og:type" content="website">
<title>LoversCase Discover | 7 Steps of Death | NemxNovels — A Havenfall Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --ink:#1a1a1a;
    --red:#e0102a; --red-dark:#7a0512;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    margin:0; min-height:100%; font-family:'Inter',sans-serif; background:var(--bg);
    background-image:
      radial-gradient(circle at 8% 8%, rgba(224,16,42,0.16), transparent 40%),
      radial-gradient(circle at 95% 92%, rgba(15,2,4,0.14), transparent 45%);
    display:flex; align-items:center; justify-content:center; padding:40px 16px;
  }
  .phone{
    width:360px; max-width:100%; background:#fff; border-radius:32px;
    box-shadow:0 30px 60px rgba(20,4,8,0.14),0 2px 6px rgba(20,4,8,0.08);
    padding:24px 18px 22px; position:relative; overflow:hidden;
  }
  .phone::before{
    content:""; position:absolute; top:-60px; right:-60px; width:180px; height:180px;
    background:radial-gradient(circle, rgba(224,16,42,0.18), transparent 70%); pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .logo-box{
    width:38px; height:38px; border-radius:10px; background:#0d0203;
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;
  }
  .logo-box img{ width:100%; height:100%; object-fit:cover; }
  .brand-name{ font-family:'Space Mono',monospace; font-weight:700; font-size:16px; color:var(--ink); }

  .stage{
    position:relative; width:100%; height:600px; border-radius:22px; overflow:hidden;
    background:#100304;
  }
  .slide{ position:absolute; inset:0; opacity:0; transition:opacity 1s ease; }
  .slide.active{ opacity:1; }
  /* dark fade so the text always reads over any photo */
  .stage::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:70%; z-index:2; pointer-events:none;
    background:linear-gradient(to top, rgba(8,2,3,0.92) 0%, rgba(8,2,3,0.55) 45%, transparent 100%);
  }

  .top-controls{
    position:absolute; top:14px; left:14px; right:14px; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; text-decoration:none;
    background:rgba(10,3,4,0.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{ transform:scale(0.94); }
  .counter{
    font-family:'Space Mono',monospace; font-size:11px; font-weight:700; color:rgba(255,255,255,0.85);
    background:rgba(10,3,4,0.45); border-radius:20px; padding:5px 10px; letter-spacing:0.06em;
  }
  .match-btn{
    padding:0 14px; height:34px; border-radius:20px; cursor:pointer; text-decoration:none;
    background:rgba(10,3,4,0.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:12.5px; font-weight:700;
    display:flex; align-items:center; white-space:nowrap;
  }

  /* Arrows: SVG chevron perfectly centered in the circle */
  .nav-btn{
    position:absolute; top:34%; transform:translateY(-50%); z-index:5;
    width:46px; height:46px; padding:0; margin:0; border-radius:50%; cursor:pointer;
    background:rgba(10,3,4,0.32);
    backdrop-filter:blur(10px) saturate(140%);
    -webkit-backdrop-filter:blur(10px) saturate(140%);
    border:1.5px solid rgba(255,255,255,0.85);
    color:#fff; line-height:0;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.25s ease, transform 0.25s ease;
    opacity:1;
  }
  .nav-btn svg{ display:block; width:22px; height:22px; flex-shrink:0; }
  .nav-btn:active{ transform:translateY(-50%) scale(0.94); }
  .nav-btn.hidden{ opacity:0; pointer-events:none; transform:translateY(-50%) scale(0.85); }
  .nav-left{ left:16px; }
  .nav-right{ right:16px; }

  /* Bottom sheet: collapsed shows name, district and a short bio; expanded fills the card and scrolls */
  .info-panel{
    position:absolute; left:0; right:0; bottom:0; z-index:3;
    height:40%; overflow-y:hidden; scrollbar-width:none;
    border-radius:24px 24px 0 0; padding:10px 18px 18px;
    background:transparent;
    transition:height .35s ease, border-radius .35s ease, background .35s ease, padding-top .35s ease;
    overscroll-behavior:contain;
  }
  .info-panel.expanded{
    height:100%; overflow-y:auto; border-radius:0;
    background:rgba(8,2,3,0.9);
    backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    padding-top:62px;
  }
  .info-panel::-webkit-scrollbar{ display:none; }
  .grab{
    width:38px; height:5px; border-radius:3px; background:rgba(255,255,255,0.5);
    margin:0 auto 14px; cursor:pointer;
  }

  .role-chip{
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
    color:#fff; background:linear-gradient(135deg,var(--red),var(--red-dark));
    padding:4px 11px; border-radius:20px; margin-bottom:10px;
  }

  /* Name row + age box (from the first design) */
  .name-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .name{ font-family:'Playfair Display',serif; font-size:30px; font-weight:700; color:#fff; line-height:1.08; }
  .age-box{
    background:linear-gradient(135deg,var(--red-dark),#1a1a1a);
    border-radius:12px; padding:4px 12px; text-align:center; flex-shrink:0;
  }
  .age-box .age-label{ font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(255,255,255,0.6); }
  .age-box .age-num{ font-size:18px; font-weight:700; color:#fff; }

  .handle{ font-size:12.5px; color:rgba(255,255,255,0.6); margin:2px 0 10px; }

  /* Location pill (from the first design) */
  .location{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    color:#fff; background:rgba(224,16,42,0.28); border:1px solid rgba(255,255,255,0.15);
    padding:5px 11px; border-radius:20px; margin-bottom:14px;
  }

  .bio-text{ font-size:13px; line-height:1.55; color:rgba(255,255,255,0.92); margin-bottom:18px; }
  .info-panel:not(.expanded) .bio-text{
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }

  .section-label{ font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:rgba(255,255,255,0.55); margin-bottom:8px; }

  .scroll-hint{
    width:34px; height:4px; border-radius:3px; background:rgba(255,255,255,0.45);
    margin:4px auto 0; position:sticky; bottom:0;
  }
  .compat-tier { font-size:14px; font-weight:700; color:#fff; margin-bottom:10px; }
  .compat-block { margin-bottom:10px; }
  .compat-block b { display:block; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:3px; }
  .compat-block p { margin:0 0 3px; font-size:12.5px; line-height:1.45; color:rgba(255,255,255,0.88); }
  .compat-note { font-size:12px; color:rgba(255,255,255,0.65); margin-bottom:12px; }
  .compat-row { margin-bottom:10px; }
  .compat-head { display:flex; justify-content:space-between; font-size:11.5px; color:rgba(255,255,255,0.8); }
  .compat-bar { height:5px; border-radius:4px; background:rgba(255,255,255,0.14); margin-top:5px; overflow:hidden; }
  .compat-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--red),#ff6b7d); }

  /* On a real phone: drop the phone frame and fill the screen. PCs keep the framed card. */
  @media (max-width:600px), (pointer:coarse) and (max-width:900px) {
    body { display:block; padding:0; }
    .phone {
      width:100%; max-width:none; min-height:100vh; min-height:100dvh;
      border-radius:0; box-shadow:none; padding:12px 0 0;
      display:flex; flex-direction:column;
    }
    .phone::before { display:none; }
    .brand { margin:0 0 12px; padding:0 14px; }
    .stage { flex:1; height:auto; min-height:420px; border-radius:0; }
    .info-panel { padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="brand">
      <div class="logo-box">
        <img src="logo.png" alt="LoversCase logo">
      </div>
      <div class="brand-name">LoversCase</div>
    </div>

    <div class="stage" id="stage">
      <!-- photo slides injected by JS -->

      <div class="top-controls">
        <a class="icon-btn" id="bookBtn" href="https://nemxnovels.site/havenfall/sevensteps/" aria-label="Read 7 Steps of Death">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path>
          </svg>
        </a>
        <div class="counter" id="counter">1 / 1</div>
        <a class="match-btn" id="matchBtn" href="#">--</a>
      </div>

      <button class="nav-btn nav-left" id="prevProfile" aria-label="Previous profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15.5 5l-7 7 7 7"></path>
        </svg>
      </button>
      <button class="nav-btn nav-right" id="nextProfile" aria-label="Next profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8.5 5l7 7-7 7"></path>
        </svg>
      </button>

      <div class="info-panel" id="infoPanel">
        <div class="grab" id="grab"></div>
        <div class="role-chip" id="p-role">The Heir</div>

        <div class="name-row">
          <div class="name" id="p-name">Raymond<br>Kazersdale</div>
          <div class="age-box">
            <div class="age-label">Age</div>
            <div class="age-num" id="p-age">28</div>
          </div>
        </div>
        <div class="handle" id="p-handle">@raymond.kazersdale</div>

        <div class="location">📍 <span id="p-location">Havenfall, Kingsmere</span></div>

        <div class="bio-text" id="p-bio"></div>

        <div class="section-label">Compatibility</div>
        <div id="p-compat"></div>
        <div class="scroll-hint"></div>
      </div>
    </div>
  </div>

<script src="loverscase-scoring.js"></script>
<script src="loverscase-characters.js"></script>
<script>
  const profiles = LC_CHARACTERS;

  // Change these to wherever the pages live on your site
  const QUIZ_PAGE = 'loverscase-quiz.html';
  const RESULTS_PAGE = 'loverscase-results.html';

  let profileIndex = 0;
  let photoIndex = 0;
  let photoTimer = null;
  const stage = document.getElementById('stage');
  const infoPanel = document.getElementById('infoPanel');
  const navLeft = document.getElementById('prevProfile');
  const navRight = document.getElementById('nextProfile');

  function renderPhotos(){
    stage.querySelectorAll('.slide').forEach(s => s.remove());
    const p = profiles[profileIndex];
    p.photos.forEach((bg, i) => {
      const div = document.createElement('div');
      div.className = 'slide' + (i === 0 ? ' active' : '');
      const isCssValue = bg.startsWith('linear-gradient') || bg.startsWith('radial-gradient') || bg.startsWith('url(');
      if (isCssValue) {
        div.style.background = bg;
      } else {
        div.style.backgroundImage = "url('" + bg + "')";
        div.style.backgroundSize = 'cover';
        div.style.backgroundPosition = 'center top';
        div.style.backgroundRepeat = 'no-repeat';
      }
      stage.insertBefore(div, stage.firstChild);
    });
    photoIndex = 0;
    if (photoTimer) clearInterval(photoTimer);
    if (p.photos.length > 1) {
      photoTimer = setInterval(() => {
        const slides = stage.querySelectorAll('.slide');
        slides[photoIndex].classList.remove('active');
        photoIndex = (photoIndex + 1) % slides.length;
        slides[photoIndex].classList.add('active');
      }, 4000);
    }
  }

  function renderCompat(p){
    const user = lcLoadProfile();
    const btn = document.getElementById('matchBtn');
    const box = document.getElementById('p-compat');
    box.innerHTML = '';

    if (!user) {
      btn.textContent = 'Take the test';
      btn.href = QUIZ_PAGE;
      const note = document.createElement('div');
      note.className = 'compat-note';
      note.textContent = 'Take the test to see how compatible you are with each person.';
      box.appendChild(note);
      return;
    }

    const m = lcMatch(user.scores, p);
    btn.textContent = m.percent + '% match';
    btn.href = RESULTS_PAGE;

    function block(title, lines) {
      const wrap = document.createElement('div');
      wrap.className = 'compat-block';
      const b = document.createElement('b');
      b.textContent = title;
      wrap.appendChild(b);
      lines.forEach(function (line) {
        const para = document.createElement('p');
        para.textContent = line;
        wrap.appendChild(para);
      });
      return wrap;
    }

    const tier = document.createElement('div');
    tier.className = 'compat-tier';
    tier.textContent = m.percent + '% · ' + m.tier;
    box.appendChild(tier);

    box.appendChild(block('Where you match', [m.matchText]));
    box.appendChild(block('Potential friction', m.frictions));
    box.appendChild(block('Dynamic', [m.dynamicText]));

    [['Trait alignment', m.alignment], ['Relationship dynamics', m.dynamics], ['Their preferences', m.preferences]]
      .forEach(function (item) {
        const row = document.createElement('div');
        row.className = 'compat-row';
        row.innerHTML =
          '<div class="compat-head"><span>' + item[0] + '</span><span>' + item[1] + '%</span></div>' +
          '<div class="compat-bar"><div class="compat-fill" style="width:' + item[1] + '%"></div></div>';
        box.appendChild(row);
      });
  }

  let expanded = false;

  function setExpanded(v){
    expanded = v;
    infoPanel.classList.toggle('expanded', v);
    navLeft.classList.toggle('hidden', v);
    navRight.classList.toggle('hidden', v);
    if (!v) infoPanel.scrollTop = 0;
  }

  function renderProfile(){
    const p = profiles[profileIndex];
    document.getElementById('p-role').textContent = p.role || '';
    document.getElementById('p-role').style.display = p.role ? 'inline-block' : 'none';
    document.getElementById('p-name').innerHTML = p.name;
    document.getElementById('p-handle').textContent = p.handle;
    document.getElementById('p-age').textContent = p.age;
    document.getElementById('p-location').textContent = p.location;
    document.getElementById('p-bio').textContent = p.bio;
    document.getElementById('counter').textContent = (profileIndex + 1) + ' / ' + profiles.length;

    renderCompat(p);
    setExpanded(false);
    renderPhotos();
  }

  // touch: swipe up to expand, swipe down (from the top) to collapse
  let startY = 0, startedAtTop = true;
  infoPanel.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startedAtTop = infoPanel.scrollTop <= 0;
  }, {passive:true});
  infoPanel.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - startY;
    if (!expanded && dy < -20) { setExpanded(true); startY = e.touches[0].clientY; }
    else if (expanded && startedAtTop && infoPanel.scrollTop <= 0 && dy > 30) { setExpanded(false); }
  }, {passive:true});

  // mouse wheel (desktop)
  infoPanel.addEventListener('wheel', e => {
    if (!expanded && e.deltaY > 10) setExpanded(true);
    else if (expanded && infoPanel.scrollTop <= 0 && e.deltaY < -10) setExpanded(false);
  }, {passive:true});

  // tap the handle to toggle
  document.getElementById('grab').addEventListener('click', () => setExpanded(!expanded));

  navLeft.addEventListener('click', () => {
    profileIndex = (profileIndex - 1 + profiles.length) % profiles.length;
    renderProfile();
  });
  navRight.addEventListener('click', () => {
    profileIndex = (profileIndex + 1) % profiles.length;
    renderProfile();
  });

  renderProfile();
</script>
</body>
</html>
